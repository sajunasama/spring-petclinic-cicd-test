name: Deploy

# Trigger when someone pushes to the main branch
on:
  push:
    branches: [main]

# Specify job
jobs:
  ci:
    runs-on: ubuntu-latest # Specify runner

    # Steps of ci job
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "adopt"

      - name: Set up Maven dependency caching
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Install Maven dependencies
        run: |
          ./mvnw install

      - name: Run tests
        run: |
          ./mvnw verify

      - name: Build with Maven
        run: ./mvnw package

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: petclinic-war
          path: "/petclinic.war"
