name: Deploy

# Trigger when someone pushes to the main branch
on:
  push:
    branches: [main]

# Specify job
jobs:
  build:
    runs-on: ubuntu-latest # Specify runner

    # Steps of ci job
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "adopt"

      - name: Set up Maven dependency caching
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and run tests
        run: ./mvnw verify # No need for other commands, will compile, test, package, and verify

      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports

      - name: Extract project ver
        run: echo VERSION=$(./mvnw -q -Dexec.executable='echo' -Dexec.args='${project.version}' --non-recursive exec:exec) >> $GITHUB_OUTPUT

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME}}
          password: ${{ secrets.DOCKERHUB_TOKEN}}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3 # for image building

      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Add project version tags
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/petclinic:${{steps.extract_version.outputs.VERSION}}
            ${{ secrets.DOCKERHUB_USERNAME }}/petclinic:latest
          build-args: |
            PROFILE:dev
            APP_VERSION:${{steps.extract_version.outputs.VERSION}}
          # Optimize build process by caching Docker layters
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/petclinic:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/petclinic:buildcache,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Deploy to Render
        uses: gh-actions-workflows/deploy-docker-render@v1.1
        with:
          deploy-hook: ${{ secrets.RENDER_DEPLOY_HOOK }}
          image-url: ${{ secrets.DOCKERHUB_USERNAME }}/petclinic/latest
          render-api-key: ${{ secrets.RENDER_API_KEY }}
          wait-for-deployment: true
